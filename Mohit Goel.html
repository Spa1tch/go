<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PU Foam Scrap Collection - WhatsApp chatbot</title>
<style>
:root{
  --page:#d1d7db; --head:#008069; --head-ink:#fff; --wall:#efeae2; --dot:rgba(11,20,26,.045);
  --in:#fff; --out:#d9fdd3; --ink:#111b21; --sub:#667781; --link:#027eb5; --accent:#00a884;
  --bar:#f0f2f5; --field:#fff; --chip:#fff; --sys:#ffeecd; --sysink:#54656f; --tick:#53bdeb;
  --shadow:0 1px .5px rgba(11,20,26,.13);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0b141a; --head:#202c33; --wall:#0b141a; --dot:rgba(255,255,255,.035);
    --in:#202c33; --out:#005c4b; --ink:#e9edef; --sub:#8696a0; --link:#53bdeb; --accent:#00a884;
    --bar:#202c33; --field:#2a3942; --chip:#182229; --sys:#182229; --sysink:#ffd279;
  }
}
:root[data-theme="dark"]{
  --page:#0b141a; --head:#202c33; --wall:#0b141a; --dot:rgba(255,255,255,.035);
  --in:#202c33; --out:#005c4b; --ink:#e9edef; --sub:#8696a0; --link:#53bdeb;
  --bar:#202c33; --field:#2a3942; --chip:#182229; --sys:#182229; --sysink:#ffd279;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);font-family:"Segoe UI",Helvetica Neue,Helvetica,Arial,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.phone{position:relative;width:390px;height:min(820px,calc(100% - 56px));background:var(--wall);border-radius:34px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 0 0 9px #111,0 20px 60px rgba(0,0,0,.35)}
.hint{font-size:13px;color:var(--sub);text-align:center}
@media (max-width:500px){
  body{gap:0;justify-content:flex-start}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .hint{display:none}
}
svg.ic{width:24px;height:24px;fill:currentColor;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:8px;padding:8px 6px 8px 4px;position:relative;z-index:3}
.top .back{display:flex;align-items:center;gap:0;padding:4px 2px}
.avatar{width:38px;height:38px;border-radius:50%;background:#e8f5e9;display:grid;place-items:center;flex:none;overflow:hidden}
.who{flex:1;min-width:0;line-height:1.2}
.who b{font-weight:500;font-size:16.5px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:12.5px;opacity:.85;display:block;height:15px}
.verified{width:15px;height:15px;flex:none}
.top .act{padding:8px 9px;border-radius:50%}
.menu{position:absolute;right:8px;top:52px;background:var(--in);color:var(--ink);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);min-width:170px;padding:6px 0;z-index:6}
.menu button{display:block;width:100%;text-align:left;padding:11px 18px;font-size:15px}
.menu button:hover{background:rgba(127,127,127,.12)}

/* chat */
.chat{flex:1;overflow-y:auto;padding:10px 10px 6px;background-color:var(--wall);
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px),radial-gradient(var(--dot) 1.4px,transparent 1.6px);
  background-size:26px 26px;background-position:0 0,13px 13px;display:flex;flex-direction:column;scroll-behavior:smooth}
.chip{align-self:center;background:var(--chip);color:var(--sysink);font-size:12.5px;padding:5px 11px;border-radius:8px;box-shadow:var(--shadow);margin:6px 0 8px;text-transform:none}
.sys{align-self:center;background:var(--sys);color:var(--sysink);font-size:12px;text-align:center;padding:7px 11px;border-radius:8px;box-shadow:var(--shadow);max-width:88%;margin-bottom:10px;line-height:1.35}
.row{display:flex;flex-direction:column;max-width:84%;margin-bottom:2px}
.row.in{align-self:flex-start;align-items:flex-start}
.row.out{align-self:flex-end;align-items:flex-end}
.row.first{margin-top:6px}
.bub{position:relative;padding:6px 8px 5px 9px;border-radius:8px;box-shadow:var(--shadow);font-size:14.5px;line-height:1.32;word-wrap:break-word;overflow-wrap:anywhere}
.in .bub{background:var(--in)} .out .bub{background:var(--out)}
.first.in .bub{border-top-left-radius:0}
.first.out .bub{border-top-right-radius:0}
.first.in .bub::before,.first.out .bub::before{content:"";position:absolute;top:0;width:8px;height:13px}
.first.in .bub::before{left:-8px;background:var(--in);clip-path:polygon(100% 0,100% 100%,0 0)}
.first.out .bub::before{right:-8px;background:var(--out);clip-path:polygon(0 0,100% 0,0 100%)}
.bub .txt{white-space:pre-wrap}
.meta{float:right;margin:7px 0 -3px 12px;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:3px;line-height:1}
.tick{letter-spacing:-.55em;font-size:13px;margin-right:.5em;color:var(--sub);font-weight:700}
.tick.read{color:var(--tick)}
.bub.photo{padding:3px}
.bub.photo img{display:block;width:230px;max-width:100%;border-radius:6px}
.bub.photo .meta{position:absolute;right:9px;bottom:7px;margin:0;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.7)}
.bub.photo .tick{color:#fff}.bub.photo .tick.read{color:var(--tick)}
.btns{display:flex;flex-direction:column;gap:2px;width:100%;min-width:230px;margin-top:2px}
.btns button{background:var(--in);color:var(--link);border-radius:8px;box-shadow:var(--shadow);padding:11px 8px;text-align:center;font-size:14.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px}
.btns button:hover{filter:brightness(.97)}
.btns button.list{color:var(--link)}
.btns.used button{pointer-events:none;opacity:.55}
.typing .bub{padding:11px 12px}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sub);opacity:.5;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}.chat{scroll-behavior:auto}}

/* composer */
.bar{display:flex;align-items:flex-end;gap:6px;padding:6px 6px 8px;background:transparent}
.field{flex:1;display:flex;align-items:center;gap:6px;background:var(--field);border-radius:24px;padding:8px 12px;color:var(--sub);min-height:44px;box-shadow:var(--shadow)}
.field input[type=text]{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--ink)}
.field input::placeholder{color:var(--sub)}
.field .cam,.field .clip,.field .emo{display:flex}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}

/* list sheet */
.sheet{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:relative;background:var(--in);border-radius:16px 16px 0 0;max-height:78%;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.sh-head{display:flex;align-items:center;gap:14px;padding:14px 14px 10px;font-weight:500;font-size:16px}
.sh-body{overflow-y:auto;padding:0 6px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 12px;font-size:15.5px;cursor:pointer;border-radius:8px}
.opt:hover{background:rgba(127,127,127,.1)}
.opt input{appearance:none;width:20px;height:20px;border:2px solid var(--sub);border-radius:50%;flex:none;margin:0;display:grid;place-items:center}
.opt input:checked{border-color:var(--accent)}
.opt input:checked::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.sh-foot{padding:10px 14px 16px}
.sh-foot button{width:100%;background:var(--accent);color:#fff;border-radius:22px;padding:12px;font-weight:500;font-size:15.5px}
.sh-foot button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></symbol>
  <symbol id="i-call" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></symbol>
  <symbol id="i-emoji" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-10c.83 0 1.5-.67 1.5-1.5S16.33 7 15.5 7 14 7.67 14 8.5s.67 1.5 1.5 1.5zm-7 0C9.33 10 10 9.33 10 8.5S9.33 7 8.5 7 7 7.67 7 8.5 7.67 10 8.5 10zm3.5 7.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></symbol>
</svg>

<div class="phone" id="phone">
  <header class="top">
    <button class="back" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg>
      <span class="avatar"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="15" width="20" height="6" rx="2" fill="#2e7d32"/><rect x="5" y="9" width="16" height="6" rx="2" fill="#66bb6a"/><rect x="7" y="4" width="12" height="5" rx="2" fill="#a5d6a7"/></svg></span>
    </button>
    <div class="who">
      <b>PU Foam Scrap Collection
        <svg class="verified" viewBox="0 0 24 24" aria-label="Business account"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="m7 12.5 3.2 3.2L17 9" stroke="#008069" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </b>
      <small id="status">Business account</small>
    </div>
    <button class="act" aria-label="Video call"><svg class="ic"><use href="#i-video"/></svg></button>
    <button class="act" aria-label="Voice call"><svg class="ic"><use href="#i-call"/></svg></button>
    <button class="act" id="menuBtn" aria-label="Menu"><svg class="ic"><use href="#i-more"/></svg></button>
    <div class="menu" id="menu" hidden><button id="restart">Restart chat</button></div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <form class="bar" id="form" autocomplete="off">
    <label class="field">
      <span class="emo"><svg class="ic"><use href="#i-emoji"/></svg></span>
      <input type="text" id="input" placeholder="Message" enterkeyhint="send" aria-label="Message">
      <button type="button" class="clip" id="clipBtn" aria-label="Attach"><svg class="ic"><use href="#i-clip"/></svg></button>
      <button type="button" class="cam" id="camBtn" aria-label="Camera"><svg class="ic"><use href="#i-cam"/></svg></button>
    </label>
    <button class="send" id="sendBtn" aria-label="Send"><svg class="ic"><use href="#i-mic"/></svg></button>
  </form>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="sheet" id="sheet" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="panel" role="dialog" aria-label="Choose an option">
      <div class="sh-head"><button id="shClose" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button><span>Choose an option</span></div>
      <div class="sh-body" id="shList"></div>
      <div class="sh-foot"><button id="shSend" disabled>Send</button></div>
    </div>
  </div>
</div>
<div class="hint">Type "Hi" to start the conversation</div>

<script>
const BOT_NAME = "PU Foam Scrap Collection";

const DETAILS = [
  { k: "Dealer name",   q: "May I know your *name*?" },
  { k: "Business name", q: "Thank you, {0}. What is your *business name*?" },
  { k: "Location",      q: "Where are you located? Please share your *area and city*." }
];
const MCQ = [
  { k: "Type of foam scrap", q: "What type of PU foam scrap do you have?", o: ["Mattress foam","Sofa foam","Cushion foam","Manufacturing waste","Mixed foam","Other"] },
  { k: "Quantity available", q: "How much foam scrap do you have right now?", o: ["Less than 50 kg","50–100 kg","100–500 kg","500–1,000 kg","More than 1,000 kg","Not sure"] },
  { k: "Current use", q: "What do you currently do with your foam scrap?", o: ["Sell to a scrap dealer","Sell to a foam/recycling company","Store it","Throw it away","Other"] },
  { k: "Interested in selling to us", q: "Would you be interested in selling your foam scrap to us?", o: ["Yes","Maybe","No"] },
  { k: "Current price per kg", q: "If you sell the scrap, approximately what price do you get per kg?", o: ["Below ₹10/kg","₹10–20/kg","₹20–30/kg","₹30–40/kg","Above ₹40/kg","Not sure"] },
  { k: "Quality", q: "How would you describe the quality of the foam scrap?", o: ["Clean","Mostly clean","Dirty","Mixed with cloth/plastic","Not sure"] },
  { k: "Dry and water-free", q: "Is the foam dry and free from water?", o: ["Yes","No","Not sure"] },
  { k: "Piece size", q: "What is the usual size of the foam pieces?", o: ["Small","Medium","Large","Mixed sizes","Not sure"] },
  { k: "Handover", q: "How would you prefer to hand over the foam scrap?", o: ["You pick it up","I can deliver it","Depends on quantity"] },
  { k: "Payment", q: "How would you prefer to receive payment?", o: ["UPI","Bank transfer","Cash","Other"] }
];
const STEPS = [
  ...DETAILS.map(d => ({ type: "text", ...d })),
  ...MCQ.map((m, i) => ({ type: "mcq", n: i + 1, ...m })),
  { type: "photo" }
];

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("sendBtn");
let stage, answers, photos, lastSender, awaitingOther, queue = Promise.resolve(), run = 0;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const clock = () => new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }).toLowerCase();
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = s => esc(s).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>");
const scroll = () => { chat.scrollTop = chat.scrollHeight; };

function reset() {
  run++;
  stage = -1; answers = {}; photos = 0; lastSender = null; awaitingOther = null;
  queue = Promise.resolve();
  chat.innerHTML = "";
  $("status").textContent = "Business account";
  const d = document.createElement("div");
  d.className = "chip"; d.textContent = "Today"; chat.appendChild(d);
  const s = document.createElement("div");
  s.className = "sys";
  s.textContent = "This business uses a secure service from Meta to manage this chat. Tap to learn more.";
  chat.appendChild(s);
}

function addMsg({ from, text, img, buttons, list }) {
  const row = document.createElement("div");
  row.className = "row " + (from === "bot" ? "in" : "out") + (lastSender !== from ? " first" : "");
  lastSender = from;
  const bub = document.createElement("div");
  bub.className = "bub" + (img ? " photo" : "");
  const tick = from === "me" ? '<span class="tick">✓✓</span>' : "";
  const meta = `<span class="meta">${clock()}${tick}</span>`;
  bub.innerHTML = img ? `<img src="${img}" alt="Photo sent by you">${meta}` : `<span class="txt">${fmt(text)}</span>${meta}`;
  row.appendChild(bub);

  if (buttons || list) {
    const wrap = document.createElement("div");
    wrap.className = "btns";
    if (buttons) buttons.forEach(label => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.onclick = () => { wrap.classList.add("used"); userSend(label); };
      wrap.appendChild(b);
    });
    if (list) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "list";
      b.innerHTML = '<svg class="ic" style="width:20px;height:20px"><use href="#i-list"/></svg>Choose option';
      b.onclick = () => openSheet(list, wrap);
      wrap.appendChild(b);
    }
    row.appendChild(wrap);
  }
  chat.appendChild(row);
  scroll();
  if (from === "me") {
    const t = row.querySelector(".tick");
    setTimeout(() => t && (t.textContent = "✓✓"), 500);
    setTimeout(() => t && t.classList.add("read"), 1300);
  }
  return row;
}

async function botSay(text, opts = {}) {
  const my = run;
  $("status").textContent = "typing…";
  const t = document.createElement("div");
  t.className = "row in typing" + (lastSender !== "bot" ? " first" : "");
  t.innerHTML = '<div class="bub"><div class="dots"><i></i><i></i><i></i></div></div>';
  chat.appendChild(t); scroll();
  await sleep(Math.min(1500, 600 + text.length * 8));
  if (my !== run) return;
  t.remove();
  $("status").textContent = "online";
  lastSender = lastSender === "bot" ? "bot" : lastSender;
  addMsg({ from: "bot", text, ...opts });
}

/* ---------- list sheet ---------- */
let sheetWrap = null, sheetChoice = null;
function openSheet(options, wrap) {
  sheetWrap = wrap; sheetChoice = null;
  $("shSend").disabled = true;
  const box = $("shList"); box.innerHTML = "";
  options.forEach(o => {
    const l = document.createElement("label");
    l.className = "opt";
    l.innerHTML = `<span>${esc(o)}</span><input type="radio" name="opt" value="${esc(o)}">`;
    l.querySelector("input").onchange = () => { sheetChoice = o; $("shSend").disabled = false; };
    box.appendChild(l);
  });
  $("sheet").hidden = false;
}
const closeSheet = () => { $("sheet").hidden = true; };
$("shClose").onclick = closeSheet; $("scrim").onclick = closeSheet;
$("shSend").onclick = () => {
  if (!sheetChoice) return;
  const c = sheetChoice; closeSheet();
  sheetWrap.classList.add("used");
  userSend(c);
};

/* ---------- conversation ---------- */
function userSend(text) {
  addMsg({ from: "me", text });
  queue = queue.then(() => handle(text));
}

function match(opts, text) {
  const t = text.trim().toLowerCase();
  if (/^\d+$/.test(t)) return opts[+t - 1] || null;
  return opts.find(o => o.toLowerCase() === t) || opts.find(o => o.toLowerCase().includes(t) && t.length > 2) || null;
}

async function ask(i) {
  const my = run;
  stage = i;
  const s = STEPS[i];
  if (s.type === "text") {
    const q = s.q.replace("{0}", (answers["Dealer name"] || "").split(" ")[0]);
    return botSay(q);
  }
  if (s.type === "mcq") {
    const text = `*Question ${s.n} of ${MCQ.length}*\n${s.q}`;
    return botSay(text, s.o.length <= 3 ? { buttons: s.o } : { list: s.o });
  }
  await botSay("Last step. Please send *2 to 3 photos* of your foam scrap using the 📎 or camera icon below.", { buttons: ["Skip for now"] });
}

async function finish() {
  stage = STEPS.length;
  const lines = Object.entries(answers).map(([k, v]) => `*${k}:* ${v}`).join("\n");
  await botSay("Thank you, " + (answers["Dealer name"] || "").split(" ")[0] + ". Your details are recorded:\n\n" + lines + `\n*Photos shared:* ${photos}`);
  await botSay("Our team will go through your details and get in touch with you soon. 🙏\n\nTo submit another entry, send *Hi*.");
}

async function handle(text, isPhoto) {
  if (stage === -1) {
    await botSay(`Hello 👋 Welcome to *${BOT_NAME}*.\n\nWe buy PU foam scrap from dealers. I will ask a few quick questions. It takes about 2 minutes.`);
    return ask(0);
  }
  if (stage >= STEPS.length) {
    if (/^(hi|hello|hey)\b/i.test(text)) { answers = {}; photos = 0; stage = -1; return handle(text); }
    return botSay("Your response is already recorded. Send *Hi* if you want to submit a new entry.");
  }
  const s = STEPS[stage];

  if (isPhoto) {
    if (s.type !== "photo") return botSay("Thanks. I will need the photos at the end, after the questions. Please answer the question above first.");
    photos++;
    if (photos >= 3) return finish();
    return botSay(photos === 1 ? "Photo received ✅ (1 of 3). Please send 1 or 2 more." : "Photo received ✅ (2 of 3). Send one more, or tap Done.", { buttons: ["Done"] });
  }

  if (awaitingOther) {
    answers[awaitingOther] = "Other – " + text.trim();
    awaitingOther = null;
    return ask(stage + 1);
  }

  if (s.type === "text") {
    answers[s.k] = text.trim();
    return ask(stage + 1);
  }
  if (s.type === "mcq") {
    const hit = match(s.o, text);
    if (!hit) return botSay("Please pick one of the options for this question. Tap *Choose option* above, or reply with the option number.");
    if (hit === "Other") {
      awaitingOther = s.k;
      return botSay("Please type your answer.");
    }
    answers[s.k] = hit;
    return ask(stage + 1);
  }
  if (s.type === "photo") {
    if (/skip|done|no\b/i.test(text)) {
      if (photos === 0) await botSay("No problem. You can share photos with us later.");
      return finish();
    }
    return botSay("Please send the photos using the 📎 or camera icon, or tap *Skip for now*.");
  }
}

/* ---------- composer ---------- */
function syncSend() {
  const has = input.value.trim().length > 0;
  sendBtn.innerHTML = `<svg class="ic"><use href="#i-${has ? "send" : "mic"}"/></svg>`;
}
input.addEventListener("input", syncSend);
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v) return;
  input.value = ""; syncSend();
  userSend(v);
});
const pick = () => $("file").click();
$("clipBtn").onclick = pick; $("camBtn").onclick = pick;
$("file").addEventListener("change", e => {
  [...e.target.files].forEach(f => {
    const url = URL.createObjectURL(f);
    addMsg({ from: "me", img: url });
    queue = queue.then(() => handle("", true));
  });
  e.target.value = "";
});

/* ---------- menu ---------- */
$("menuBtn").onclick = e => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
document.addEventListener("click", () => { $("menu").hidden = true; });
$("restart").onclick = () => { reset(); input.focus(); };

reset();
</script>
